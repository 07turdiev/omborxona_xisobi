# Ishlab chiqarish tarkibi: backend va frontend.
#
# Baza konteynerda emas — serverning o'zida (native PostgreSQL 15+).
# Sabab: do'kon bitta, baza kichik, va serverdagi PostgreSQL ni
# zaxiralash, yangilash va kuzatish oddiyroq. To'liq tartib:
# docs/deployment.md.
#
# Ishga tushirish:
#   cp .env.production.example .env.production
#   # .env.production ni to'ldiring
#   ln -s .env.production .env     # compose ${...} ni `.env` dan oladi
#   docker compose up -d --build
#
# Migratsiya konteyner ishga tushganda avtomatik qo'llanadi
# (back/entrypoint.sh), qo'lda bajarish shart emas.
#
# HTTPS bu yerda yo'q: sertifikatni tashqi reverse proxy (Caddy) beradi.
# Sabab — sertifikat yangilanishi ilova hayot siklidan mustaqil bo'lsin.

services:
  backend:
    build:
      context: ./back
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL berilmagan}
    extra_hosts:
      # Konteyner ichidan serverning o'ziga yo'l
      - 'host.docker.internal:host-gateway'
    volumes:
      # Yuklangan rasmlar konteyner qayta qurilganda yo'qolmasin
      - media_data:/app/media
    healthcheck:
      # Migratsiya qolib ketgan bo'lsa konteyner sog'lom hisoblanmaydi:
      # eski sxema ustida ishlayotgani darhol ko'rinadi
      test: ['CMD', 'python', 'manage.py', 'migrate', '--check']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./front
    restart: unless-stopped
    volumes:
      # Yuklangan fayllarni nginx beradi — faqat o'qish uchun
      - media_data:/usr/share/nginx/media:ro
    ports:
      # Faqat serverning o'zida ochiq — tashqaridan faqat reverse proxy
      # orqali. Docker o'z portlarini UFW dan chetlab ochadi, shuning
      # uchun `0.0.0.0` bo'lsa firewall uni to'smasdi va HTTPS ni
      # chetlab o'tib bo'lardi.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  media_data:
