# Frontend uchun nginx.
#
# Ikki vazifa: statik fayllarni berish va `/api` so'rovlarini backendga
# uzatish. Ikkalasi bitta domenda bo'lgani uchun CORS umuman kerak
# bo'lmaydi — brauzer uchun bu bitta sayt.

server {
    listen 80;
    server_name _;

    # Yuklanadigan fayl hajmi (mahsulot rasmlari uchun)
    client_max_body_size 20M;

    # Siqish — matn fayllar uchun sezilarli tejaydi
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vue Router history rejimi: mavjud bo'lmagan yo'l index.html ga
    # tushadi va marshrutni Vue hal qiladi
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hash bilan nomlangan fayllar hech qachon o'zgarmaydi
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django SECURE_PROXY_SSL_HEADER shu sarlavhaga qaraydi
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django statik fayllari (admin paneli uchun) whitenoise orqali
    # backenddan keladi
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
