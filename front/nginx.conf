# Frontend uchun nginx.
#
# Ikki vazifa: statik fayllarni berish va `/api` so'rovlarini backendga
# uzatish. Ikkalasi bitta domenda bo'lgani uchun CORS umuman kerak
# bo'lmaydi — brauzer uchun bu bitta sayt.

# HTTPS ni tashqi proxy (Caddy) yechadi va `X-Forwarded-Proto: https`
# yuboradi. Uni `$scheme` (bu yerda doim "http") bilan almashtirsak,
# Django so'rovni HTTP deb o'ylab HTTPS ga qayta yo'naltiradi — brauzerda
# cheksiz aylanish. Sarlavha yo'q bo'lsa (proxy'siz), o'zimizning sxema.
#
# Sarlavhaga ishonish xavfsiz, chunki port faqat 127.0.0.1 da ochiq
# (docker-compose.yml) — tashqaridan unga faqat Caddy orqali kiriladi.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Yuklanadigan fayl hajmi (mahsulot rasmlari, Excel import)
    client_max_body_size 20M;

    # Siqish — matn fayllar uchun sezilarli tejaydi
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vue Router history rejimi: mavjud bo'lmagan yo'l index.html ga
    # tushadi va marshrutni Vue hal qiladi
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hash bilan nomlangan fayllar hech qachon o'zgarmaydi
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django SECURE_PROXY_SSL_HEADER shu sarlavhaga qaraydi
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        # Katta Excel importi bir necha soniya tekshiriladi
        proxy_read_timeout 120s;
    }

    # Django admin paneli tashqaridan ochilmaydi.
    #
    # Kundalik ishning hammasi ilovaning o'z interfeysida bajariladi.
    # Admin paneli esa butun bazaga to'g'ridan-to'g'ri yo'l ochadi:
    # parol o'g'irlansa, u yerdan hamma narsani o'zgartirib bo'ladi.
    #
    # Kerak bo'lganda serverning o'zida buyruq bilan ishlanadi:
    #   docker compose exec backend python manage.py <buyruq>
    location /admin/ {
        return 404;
    }

    # Django statik fayllari (admin paneli uchun) whitenoise orqali
    # backenddan keladi
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Yuklangan fayllar (mahsulot rasmlari, logotiplar) umumiy volume'dan
    # to'g'ridan-to'g'ri beriladi. Backendga uzatib bo'lmaydi: Django media
    # fayllarni faqat DEBUG=True da beradi, ya'ni serverda ular 404 bo'lardi.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }
}
